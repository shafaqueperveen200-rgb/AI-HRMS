<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee — WorkforcePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='add_employee.css') }}">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        {% include 'admin_sidebar.html' %}
        <main class="main-wrapper">
            <header class="dashboard-header">
                <div class="header-title">
                    <h1>Onboard New Employee</h1>
                    <p>Fill in staff details to add them to the directory.</p>
                </div>
            </header>
            <div class="dashboard-content">

                <div class="auth-container" style="max-width: 500px; margin: 0 auto;">
                    <div class="auth-card">

            <form action="/add-employee" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Rahul Verma" required class="form-input">
                </div>

                <div class="form-group">
                    <label for="role">Designation / Role</label>
                    <input type="text" id="role" name="role" placeholder="e.g. Backend Developer" required class="form-input">
                </div>

                <div class="form-group">
                    <label for="dept">Department</label>
                    <select id="dept" name="dept" class="form-input" required>
                        <option value="" disabled selected>Select department</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Human Resources">Human Resources</option>
                        <option value="Design">Design</option>
                        <option value="Marketing">Marketing</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" name="email" placeholder="rahul@workforcepro.demo" required class="form-input">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="+91 98765 43210" class="form-input">
                </div>

                <div class="form-group">
                    <label for="status">Employment Status</label>
                    <select id="status" name="status" class="form-input" required>
                        <option value="Active">Active</option>
                        <option value="On Leave">On Leave</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                    <a href="{{ url_for('employees') }}" class="btn-secondary btn-full" style="text-decoration: none; text-align: center; padding: 0.75rem;">Cancel</a>
                    <button type="submit" class="btn-primary btn-full" style="margin-top: 0;">Save Employee</button>
                </div>
            </form>
        </div>
    </div>
            </div>
        </main>
    </div>

</body>
</html>
