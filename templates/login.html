<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — WorkforcePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container" style="max-width: 480px;">
        <div class="mb-3">
            <a href="{{ url_for('welcome') }}" class="text-decoration-none text-secondary small d-inline-flex align-items-center gap-1">
                <i class="bi bi-arrow-left" aria-hidden="true"></i> Back
            </a>
        </div>

        <div class="text-center mb-4">
            <a href="{{ url_for('welcome') }}" class="text-decoration-none d-inline-flex align-items-center gap-2">
                <div style="width: 42px; height: 42px; background: #4f46e5; color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem;">W</div>
                <span class="fs-4 fw-bold text-dark">Workforce<span style="color: #4f46e5;">Pro</span></span>
            </a>
            <h2 class="fw-bold mt-3 text-dark">Log In</h2>
            <p class="text-muted small">HR Management System Login</p>
        </div>

        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show small" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        {% if registered %}
            <div class="alert alert-success alert-dismissible fade show small" role="alert">
                Registration successful! Please log in.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <div class="card shadow-sm border-0 p-4 rounded-4 bg-white">
            <form action="{{ url_for('login_action') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-secondary">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="e.g. shafaque@workforcepro.demo" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small text-secondary">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small text-secondary d-block">Login As:</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="role" id="roleEmployee" value="employee" checked>
                            <label class="form-check-label" for="roleEmployee">Employee</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="admin">
                            <label class="form-check-label" for="roleAdmin">Admin</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Login</button>
            </form>
        </div>

        <div class="text-center mt-4 small text-muted">
            Don't have an account? <a href="{{ url_for('signup') }}" class="text-primary fw-semibold text-decoration-none">Register or Sign up</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
