<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit — {{ emp.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='edit_profile.css') }}">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        {% include 'admin_sidebar.html' %}
        <main class="main-wrapper">
            <header class="dashboard-header">
                <div class="header-title">
                    <h1>Edit Employee Profile</h1>
                    <p>Update records for {{ emp.id }}.</p>
                </div>
            </header>
            <div class="dashboard-content" style="padding: 2rem;">
            <div class="edit-profile-card">
                <h2 style="margin-top: 0; color: #0f172a;">Edit Employee Profile</h2>
                <p style="color: #64748b; font-size: 0.875rem; margin-bottom: 1.5rem;">Update records for {{ emp.id }}</p>
                
                <form method="POST">
                    <div class="edit-form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" value="{{ emp.name }}" required>
                    </div>

                    <div class="edit-form-group">
                        <label style="display: block; font-weight: 600; font-size: 0.8125rem; color: #475569; margin-bottom: 0.375rem;">Job Role / Title</label>
                        <input type="text" name="role" value="{{ emp.role }}" required style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.95rem;">
                    </div>

                    <div class="edit-form-group">
                        <label style="display: block; font-weight: 600; font-size: 0.8125rem; color: #475569; margin-bottom: 0.375rem;">Department</label>
                        <input type="text" name="dept" value="{{ emp.dept }}" required style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.95rem;">
                    </div>

                    <div class="edit-form-group">
                        <label for="email">Work Email</label>
                        <input type="email" id="email" name="email" value="{{ emp.email }}" required>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; font-weight: 600; font-size: 0.8125rem; color: #475569; margin-bottom: 0.375rem;">Phone Number</label>
                        <input type="text" name="phone" value="{{ emp.phone }}" required style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.95rem;">
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; font-weight: 600; font-size: 0.8125rem; color: #475569; margin-bottom: 0.375rem;">Status</label>
                        <select name="status" style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.95rem; background: white;">
                            <option value="Active" {% if emp.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="On Leave" {% if emp.status == 'On Leave' %}selected{% endif %}>On Leave</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <button type="submit" class="btn-add-employee" style="flex: 1; justify-content: center;">💾 Save Changes</button>
                        <a href="{{ url_for('view_profile', emp_id=emp.id) }}" class="btn-back-dir" style="flex: 1; justify-content: center; text-align: center;">Cancel</a>
                    </div>
                </form>
            </div>
            </div>
        </main>
    </div>
</body>
</html>
