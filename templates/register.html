<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WorkforcePro</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 px-3 py-4">

    <div class="card shadow-sm p-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">WorkforcePro</h3>
            <p class="text-muted small">Create Your Account</p>
        </div>

        <!-- Error Alert -->
        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show py-2" role="alert">
                <small>{{ error }}</small>
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <form action="/register" method="POST">
            <!-- Email Input -->
            <div class="mb-3">
                <label class="form-label fw-semibold small">Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ email if email else '' }}" placeholder="Enter your email" required>
            </div>

            <!-- Password Input -->
            <div class="mb-3">
                <label class="form-label fw-semibold small">Create Password</label>
                <input type="password" name="password" class="form-control" placeholder="At least 8 characters" required>
            </div>

            <!-- Confirm Password Input -->
            <div class="mb-3">
                <label class="form-label fw-semibold small">Confirm Password</label>
                <input type="password" name="password_confirm" class="form-control" placeholder="Re-enter password" required>
            </div>

            <!-- Role Selection (Employee vs Admin) -->
            <div class="mb-4">
                <label class="form-label fw-semibold small d-block">Register As:</label>
                <div class="d-flex gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="regEmployee" value="employee" checked>
                        <label class="form-check-label" for="regEmployee">Employee</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="regAdmin" value="admin">
                        <label class="form-check-label" for="regAdmin">Admin</label>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Create Account</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">Already registered? <a href="/login" class="text-decoration-none">Sign in</a></small>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
